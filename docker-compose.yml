services:
  postgres:
    image: postgres:16-alpine
    container_name: splitly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitly
      POSTGRES_PASSWORD: splitly
      POSTGRES_DB: splitly
    ports:
      - "5432:5432"
    volumes:
      - splitly-postgres-data:/var/lib/postgresql/data

volumes:
  splitly-postgres-data:
